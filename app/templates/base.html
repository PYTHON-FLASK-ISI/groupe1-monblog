{# templates/base.html #}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>{% block titre %}MonBlog{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <nav>

        <img src="{{ url_for('static', filename='img/logo-isi.jpg') }}" alt="Logo MonBlog" width="100" height="120">

        <a href="{{ url_for('articles.article') }}">Articles</a>
        <a href="{{ url_for('produits.produits') }}">Produits</a>
    </nav>
  </header>
  <main>
    {% block contenu %}CONTENU DE BASE{% endblock %}
  </main>
  <footer>&copy; 2026 MonBlog — ISI</footer>
</body>
</html>
